<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; color: #141517; }
    .num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; letter-spacing: -0.03em; }
    .mono { font-family: "IBM Plex Mono", Consolas, monospace; }
    a { color: #FF4F18; } a:hover { color: #141517; }
  </style>
</helmet>
<div style="width: 1280px; height: 800px; background: #F2F4F7; display: flex; overflow: hidden;">

  <div style="width: 72px; background: #141517; display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 26px;">
    <div style="width: 30px; height: 30px; background: #FF4F18; display: grid; place-items: center;">
      <svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1 L15 14 H1 Z" fill="none" stroke="#141517" stroke-width="1.8"/></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 8px; align-items: center;">
      <svg width="18" height="18" viewBox="0 0 18 18"><rect x="2" y="2" width="6" height="6" fill="#5b6068"/><rect x="10" y="2" width="6" height="6" fill="#5b6068"/><rect x="2" y="10" width="6" height="6" fill="#5b6068"/><rect x="10" y="10" width="6" height="6" fill="#5b6068"/></svg>
      <svg width="18" height="18" viewBox="0 0 18 18"><path d="M2 14 L7 8 L11 11 L16 3" fill="none" stroke="#5b6068" stroke-width="2"/></svg>
      <svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 15 V9 M9 15 V3 M15 15 V6" stroke="#FF4F18" stroke-width="2.4"/></svg>
      <svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="6.5" fill="none" stroke="#5b6068" stroke-width="1.8"/><path d="M9 5 V9 L12 11" fill="none" stroke="#5b6068" stroke-width="1.8"/></svg>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 26px 32px; gap: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: flex-end;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span class="mono" style="font-size: 11px; letter-spacing: 0.12em; color: #8a8f98;">PUBLIC · /SPEED</span>
        <span class="num" style="font-size: 30px; font-weight: 600;">속도 <span style="color: #FF4F18;">.</span></span>
      </div>
      <div class="mono" style="font-size: 11px; border-radius: 999px; padding: 6px 14px; background: #141517; color: #ffffff;">주간 추세 · 최근 8주</div>
    </div>

    <div style="display: flex; gap: 16px;">
      <div style="flex: 1; background: #ffffff; border-radius: 14px; padding: 20px 24px; display: flex; flex-direction: column; gap: 4px;">
        <span class="mono" style="font-size: 10px; letter-spacing: 0.1em; color: #8a8f98;">주간 P85 속도</span>
        <div style="display: flex; align-items: baseline; gap: 8px;">
          <span class="num" style="font-size: 52px; font-weight: 600;">34.2</span>
          <span class="num" style="font-size: 16px; color: #8a8f98;">km/h</span>
          <span class="num" style="font-size: 15px; color: #FF4F18; margin-left: auto;">/ ▼ 1.4</span>
        </div>
      </div>
      <div style="flex: 1; background: #FF4F18; color: #ffffff; border-radius: 14px; padding: 20px 24px; display: flex; flex-direction: column; gap: 4px;">
        <span class="mono" style="font-size: 10px; letter-spacing: 0.1em;">K1 · 30 km/h 초과율</span>
        <div style="display: flex; align-items: baseline; gap: 8px;">
          <span class="num" style="font-size: 52px; font-weight: 600;">24%</span>
          <span class="num" style="font-size: 15px; margin-left: auto;">/ ▼ 5%p</span>
        </div>
      </div>
      <div style="flex: 1; background: #141517; color: #ffffff; border-radius: 14px; padding: 20px 24px; display: flex; flex-direction: column; gap: 4px;">
        <span class="mono" style="font-size: 10px; letter-spacing: 0.1em; color: #9aa0a8;">표본 · 신뢰</span>
        <div style="display: flex; align-items: baseline; gap: 8px;">
          <span class="num" style="font-size: 52px; font-weight: 600;">1,482</span>
          <span class="mono" style="font-size: 11px; color: #9aa0a8; margin-left: auto;">속도 ±3 km/h</span>
        </div>
      </div>
    </div>

    <div style="background: #ffffff; border-radius: 14px; padding: 24px 26px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 14px; font-weight: 700;">주별 초과율 추세 <span class="mono" style="font-weight: 400; font-size: 10.5px; color: #8a8f98;">M2 · 개입 표시선 포함</span></span>
        <span class="mono" style="font-size: 10.5px; color: #8a8f98;"><span style="display: inline-block; width: 10px; height: 10px; background: #FF4F18; vertical-align: middle; margin-right: 5px;"></span>이번 주</span>
      </div>
      <svg viewBox="0 0 1080 330" style="width: 100%; flex-grow: 1;">
        <line x1="30" y1="211" x2="1050" y2="211" stroke="#FF4F18" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.55"/>
        <text x="30" y="203" font-family="IBM Plex Mono, monospace" font-size="11" fill="#FF4F18">목표 15%</text>
        <rect x="70"  y="118" width="72" height="162" fill="#141517"/>
        <rect x="196" y="102" width="72" height="178" fill="#141517"/>
        <rect x="322" y="128" width="72" height="152" fill="#141517"/>
        <rect x="448" y="94"  width="72" height="186" fill="#141517"/>
        <rect x="574" y="120" width="72" height="160" fill="#141517"/>
        <rect x="700" y="146" width="72" height="134" fill="#141517"/>
        <rect x="826" y="158" width="72" height="122" fill="#141517"/>
        <rect x="952" y="170" width="72" height="110" fill="#FF4F18"/>
        <line x1="678" y1="70" x2="678" y2="290" stroke="#141517" stroke-width="1.5" stroke-dasharray="4 4"/>
        <text x="688" y="84" font-family="IBM Plex Mono, monospace" font-size="11" fill="#141517">개입 1 · 안내판</text>
        <text x="82"  y="302" font-family="IBM Plex Mono, monospace" font-size="10" fill="#8a8f98">W1</text>
        <text x="208" y="302" font-family="IBM Plex Mono, monospace" font-size="10" fill="#8a8f98">W2</text>
        <text x="334" y="302" font-family="IBM Plex Mono, monospace" font-size="10" fill="#8a8f98">W3</text>
        <text x="460" y="302" font-family="IBM Plex Mono, monospace" font-size="10" fill="#8a8f98">W4</text>
        <text x="586" y="302" font-family="IBM Plex Mono, monospace" font-size="10" fill="#8a8f98">W5</text>
        <text x="712" y="302" font-family="IBM Plex Mono, monospace" font-size="10" fill="#8a8f98">W6</text>
        <text x="838" y="302" font-family="IBM Plex Mono, monospace" font-size="10" fill="#8a8f98">W7</text>
        <text x="958" y="302" font-family="IBM Plex Mono, monospace" font-size="10" fill="#141517" font-weight="600">이번주</text>
        <text x="960" y="160" font-family="Archivo, sans-serif" font-size="15" font-weight="600" fill="#FF4F18">24%</text>
      </svg>
      <span style="font-size: 12px; color: #8a8f98;">기간 · 표본 · 오차: 등교일 5일 × 40분, n=1,482, 수동 대조 ±3 km/h — 모든 공개 숫자에 근거를 붙입니다.</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
