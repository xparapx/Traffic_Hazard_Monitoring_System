      <div style="display: flex; flex-direction: column;"><span class="mono" style="font-size: 9.5px; color: #8a8f98; letter-spacing: 0.08em;">차종</span><span class="num" style="font-size: 20px; font-weight: 600;">4륜</span></div>

    </div>
    <div class="mono" style="font-size: 10px; color: #b0b5bc; border-top: 1px dashed #E4E7EC; padding-top: 10px;">이미지 없음 · 창가에서 직접 보고 입력</div>
  </div>

  <div style="margin: 18px 18px 0 18px; display: flex; flex-direction: column; gap: 8px;">

      <div style="background: #ffffff; border: 2px solid #FF4F18; border-radius: 12px; padding: 15px 0; text-align: center; font-size: 15px; font-weight: 700;">승하차</div>

      <div style="background: #22262d; color: #c9ced6; border: 2px solid #22262d; border-radius: 12px; padding: 15px 0; text-align: center; font-size: 15px; font-weight: 500;">기타</div>

  </div>

  <div style="margin: auto 18px 18px 18px; display: flex; flex-direction: column; gap: 10px;">
    <div style="background: #FF4F18; color: #ffffff; border-radius: 999px; padding: 17px 0; text-align: center; font-size: 16px; font-weight: 700; letter-spacing: 0.02em;">저장</div>
