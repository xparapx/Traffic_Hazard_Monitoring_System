<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; color: #1F282E; }
    .num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; letter-spacing: -0.03em; }
    .mono { font-family: "IBM Plex Mono", Consolas, monospace; }
    a { color: #FF4E20; } a:hover { color: #1F282E; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #1F282E; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 20px 20px 16px 20px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid #333E48;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span class="mono" style="font-size: 10px; letter-spacing: 0.12em; color: #FF4E20;">ADMIN · /LABEL</span>
      <span class="mono" style="font-size: 10px; color: #98A2AB;">라벨러: 김○○</span>
    </div>
    <span style="color: #ffffff; font-size: 17px; font-weight: 700;">이 정차, 위험했나요?</span>
  </div>

  <div style="background: #E4E3DC; margin: 18px 18px 0 18px; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <span class="num" style="font-size: 30px; font-weight: 600;">08:21:14</span>
      <span class="mono" style="font-size: 11px; background: #F3DCD2; color: #B83312; padding: 3px 10px; border-radius: 6px;">no_stop</span>
    </div>
    <div style="display: flex; gap: 20px;">
      <div style="display: flex; flex-direction: column;"><span class="mono" style="font-size: 9.5px; color: #6E7780; letter-spacing: 0.08em;">지속</span><span class="num" style="font-size: 20px; font-weight: 600;">27 s</span></div>
      <div style="display: flex; flex-direction: column;"><span class="mono" style="font-size: 9.5px; color: #6E7780; letter-spacing: 0.08em;">차종</span><span class="num" style="font-size: 20px; font-weight: 600;">4륜</span></div>
      <div style="display: flex; flex-direction: column;"><span class="mono" style="font-size: 9.5px; color: #6E7780; letter-spacing: 0.08em;">구역</span><span class="num" style="font-size: 20px; font-weight: 600;">금지</span></div>
    </div>
    <div class="mono" style="font-size: 10px; color: #6E7780; border-top: 1px dashed #CBC8BC; padding-top: 10px;">이미지 없음 · 창가에서 직접 보고 입력</div>
  </div>

  <div style="margin: 18px 18px 0 18px; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <span class="mono" style="font-size: 10px; letter-spacing: 0.1em; color: #98A2AB;">남은 시간</span>
      <span class="num" style="font-size: 22px; font-weight: 600; color: #FF4E20;">41 s</span>
    </div>
    <div style="display: flex; gap: 5px;">
      <div style="flex: 1; height: 10px; background: #FF4E20;"></div>
      <div style="flex: 1; height: 10px; background: #FF4E20;"></div>
      <div style="flex: 1; height: 10px; background: #FF4E20;"></div>
      <div style="flex: 1; height: 10px; background: #FF4E20;"></div>
      <div style="flex: 1; height: 10px; background: #414E58;"></div>
      <div style="flex: 1; height: 10px; background: #414E58;"></div>
    </div>
  </div>

  <div style="margin: 22px 18px 0 18px; display: flex; flex-direction: column; gap: 10px;">
    <span class="mono" style="font-size: 10px; letter-spacing: 0.1em; color: #98A2AB;">01 / 위험 여부</span>
    <div style="display: flex; gap: 10px;">
      <div style="flex: 1; background: #FF4E20; color: #ffffff; border-radius: 12px; padding: 18px 0; text-align: center; font-size: 17px; font-weight: 700;">예</div>
      <div style="flex: 1; background: #E4E3DC; color: #1F282E; border-radius: 12px; padding: 18px 0; text-align: center; font-size: 17px; font-weight: 700;">아니오</div>
    </div>
  </div>

  <div style="margin: 20px 18px 0 18px; display: flex; flex-direction: column; gap: 10px;">
    <span class="mono" style="font-size: 10px; letter-spacing: 0.1em; color: #98A2AB;">02 / 정차 사유</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <div style="background: #E4E3DC; border: 2px solid #FF4E20; border-radius: 12px; padding: 15px 0; text-align: center; font-size: 15px; font-weight: 700;">승하차</div>
      <div style="background: #39444E; color: #C6CDD3; border: 2px solid #39444E; border-radius: 12px; padding: 15px 0; text-align: center; font-size: 15px; font-weight: 500;">대기</div>
      <div style="background: #39444E; color: #C6CDD3; border: 2px solid #39444E; border-radius: 12px; padding: 15px 0; text-align: center; font-size: 15px; font-weight: 500;">배송</div>
      <div style="background: #39444E; color: #C6CDD3; border: 2px solid #39444E; border-radius: 12px; padding: 15px 0; text-align: center; font-size: 15px; font-weight: 500;">기타</div>
    </div>
  </div>

  <div style="margin: auto 18px 18px 18px; display: flex; flex-direction: column; gap: 10px;">
    <div style="background: #FF4E20; color: #ffffff; border-radius: 999px; padding: 17px 0; text-align: center; font-size: 16px; font-weight: 700; letter-spacing: 0.02em;">저장</div>
    <div class="mono" style="font-size: 9.5px; color: #98A2AB; text-align: center; letter-spacing: 0.04em;">60초 초과 입력은 note=late으로 기록됩니다</div>
  </div>
</div>
</x-dc>
</body>
</html>
