<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; color: #1F282E; }
    .num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; letter-spacing: -0.03em; }
    .mono { font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; }
    a { color: #FF4E20; } a:hover { color: #1F282E; }
  </style>
</helmet>
<div style="width: 1280px; height: 800px; background: #DAD8CF; display: flex; overflow: hidden;">

  <div style="width: 72px; background: #1F282E; display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 26px;">
    <div style="width: 30px; height: 30px; background: #FF4E20; display: grid; place-items: center;">
      <svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1 L15 14 H1 Z" fill="none" stroke="#1F282E" stroke-width="1.8"/></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 8px; align-items: center;">
      <svg width="18" height="18" viewBox="0 0 18 18"><rect x="2" y="2" width="6" height="6" fill="#66717B"/><rect x="10" y="2" width="6" height="6" fill="#66717B"/><rect x="2" y="10" width="6" height="6" fill="#66717B"/><rect x="10" y="10" width="6" height="6" fill="#66717B"/></svg>
      <svg width="18" height="18" viewBox="0 0 18 18"><path d="M2 14 L7 8 L11 11 L16 3" fill="none" stroke="#66717B" stroke-width="2"/></svg>
      <svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 15 V9 M9 15 V3 M15 15 V6" stroke="#66717B" stroke-width="2.4"/></svg>
      <svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="6.5" fill="none" stroke="#FF4E20" stroke-width="1.8"/><path d="M9 5 V9 L12 11" fill="none" stroke="#FF4E20" stroke-width="1.8"/></svg>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 26px 32px; gap: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: flex-end;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span class="mono" style="font-size: 11px; letter-spacing: 0.12em; color: #6E7780;">PUBLIC · /DWELL</span>
        <span class="num" style="font-size: 30px; font-weight: 600;">정차 <span style="color: #FF4E20;">.</span></span>
      </div>
      <div class="mono" style="font-size: 11px; border-radius: 999px; padding: 6px 14px; background: #1F282E; color: #ffffff;">오늘 · 08:00–08:40</div>
    </div>

    <div style="display: flex; gap: 16px; flex-grow: 1;">
      <div style="flex: 2.1; background: #E4E3DC; border-radius: 14px; padding: 24px 26px; display: flex; flex-direction: column; gap: 14px;">
        <span style="font-size: 14px; font-weight: 700;">도로 평면 정차 히트맵 <span class="mono" style="font-weight: 400; font-size: 10.5px; color: #6E7780;">M3 · 군집 3</span></span>
        <svg viewBox="0 0 720 400" style="width: 100%; flex-grow: 1;">
          <defs>
            <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
              <rect width="8" height="8" fill="#B83312" opacity="0.12"/>
              <line x1="0" y1="0" x2="0" y2="8" stroke="#B83312" stroke-width="2.4" opacity="0.6"/>
            </pattern>
          </defs>
          <!-- 현장(2026-09 사진): 교문 정면으로 뻗는 도로 + 교문 앞 교차로 · 좌 주차장 · 우 GS25 -->
          <rect x="300" y="0" width="120" height="250" fill="#DAD8CF"/>
          <rect x="0" y="250" width="720" height="80" fill="#DAD8CF"/>
          <line x1="360" y1="0" x2="360" y2="214" stroke="#BEBBB0" stroke-width="2" stroke-dasharray="14 10"/>
          <line x1="0" y1="290" x2="300" y2="290" stroke="#BEBBB0" stroke-width="2" stroke-dasharray="14 10"/>
          <line x1="420" y1="290" x2="720" y2="290" stroke="#BEBBB0" stroke-width="2" stroke-dasharray="14 10"/>
          <path d="M310 218 v24 M324 218 v24 M338 218 v24 M352 218 v24 M366 218 v24 M380 218 v24 M394 218 v24 M408 218 v24" stroke="#C4C1B5" stroke-width="7"/>
          <path d="M218 258 h22 M218 274 h22 M218 290 h22 M218 306 h22 M218 322 h22" stroke="#C4C1B5" stroke-width="7"/>
          <text x="430" y="238" font-family="Noto Sans KR, sans-serif" font-size="10.5" fill="#6E7780">횡단보도 2</text>
          <rect x="24" y="24" width="230" height="196" fill="#D2CFC3" stroke="#BEBBB0" stroke-width="1.5" stroke-dasharray="5 4"/>
          <text x="36" y="46" font-family="Noto Sans KR, sans-serif" font-size="11" fill="#6E7780">주차장 · 정상 구역</text>
          <rect x="52" y="66" width="26" height="14" fill="#BEBBB0"/><rect x="88" y="66" width="26" height="14" fill="#BEBBB0"/><rect x="124" y="66" width="26" height="14" fill="#BEBBB0"/><rect x="160" y="66" width="26" height="14" fill="#BEBBB0"/>
          <rect x="52" y="92" width="26" height="14" fill="#BEBBB0"/><rect x="88" y="92" width="26" height="14" fill="#BEBBB0"/><rect x="160" y="92" width="26" height="14" fill="#BEBBB0"/>
          <rect x="470" y="24" width="226" height="196" fill="#CBC8BC" opacity="0.75"/>
          <text x="484" y="46" font-family="Noto Sans KR, sans-serif" font-size="11" fill="#6E7780">GS25 · 상가 모퉁이</text>
          <rect x="276" y="40" width="22" height="176" fill="#D2CFC3" stroke="#BEBBB0" stroke-width="1"/>
          <text x="226" y="242" font-family="Noto Sans KR, sans-serif" font-size="10.5" fill="#6E7780">승하차 구역</text>
          <rect x="422" y="120" width="22" height="126" fill="url(#hatch)"/>
          <circle cx="433" cy="150" r="9"  fill="#B83312" opacity="0.9"/>
          <circle cx="433" cy="180" r="12" fill="#B83312" opacity="0.75"/>
          <circle cx="433" cy="212" r="7"  fill="#B83312" opacity="0.55"/>
          <text x="454" y="168" font-family="Archivo, sans-serif" font-size="14" font-weight="600" fill="#B83312">정차 금지 · 군집 A 3건</text>
          <circle cx="433" cy="62" r="8" fill="#1F282E" opacity="0.6"/>
          <circle cx="433" cy="90" r="6" fill="#1F282E" opacity="0.4"/>
          <text x="454" y="78" font-family="Noto Sans KR, sans-serif" font-size="10.5" fill="#66717B">배송 정차 · GS25 앞</text>
          <rect x="280" y="330" width="160" height="70" fill="#D2CFC3"/>
          <rect x="296" y="336" width="10" height="26" fill="#98A2AB"/><rect x="414" y="336" width="10" height="26" fill="#98A2AB"/>
          <text x="330" y="386" font-family="Noto Sans KR, sans-serif" font-size="12" font-weight="700" fill="#414E58">교문</text>
          <line x1="360" y1="396" x2="302" y2="4" stroke="#66717B" stroke-width="1" stroke-dasharray="3 5" opacity="0.5"/>
          <line x1="360" y1="396" x2="418" y2="4" stroke="#66717B" stroke-width="1" stroke-dasharray="3 5" opacity="0.5"/>
          <circle cx="360" cy="392" r="5" fill="#FF4E20"/>
          <text x="374" y="398" font-family="Noto Sans KR, sans-serif" font-size="10.5" fill="#414E58">카메라 · 본관 3층 · 수평 30 m</text>
          <ellipse cx="504" cy="356" rx="58" ry="24" fill="none" stroke="#66717B" stroke-width="1.5" stroke-dasharray="4 4"/>
          <text x="466" y="360" font-family="Noto Sans KR, sans-serif" font-size="10.5" fill="#66717B">수목 가림(하단)</text>
        </svg>
      </div>

      <div style="flex: 1; display: flex; flex-direction: column; gap: 16px;">
        <div style="background: #1F282E; color: #ffffff; border-radius: 14px; padding: 20px 22px; display: flex; flex-direction: column; gap: 4px;">
          <span class="mono" style="font-size: 10px; letter-spacing: 0.1em; color: #98A2AB;">K2 · 구역 밖 20초+ 정차</span>
          <div style="display: flex; align-items: baseline; gap: 8px;">
            <span class="num" style="font-size: 52px; font-weight: 600;">6<span style="font-size: 22px; color: #98A2AB;">건</span></span>
            <span class="num" style="font-size: 15px; color: #FF4E20; margin-left: auto;">/ ▼ 1</span>
          </div>
          <span class="mono" style="font-size: 10.5px; color: #98A2AB;">최장 정차 94 s · 08:21</span>
        </div>

        <div style="background: #E4E3DC; border-radius: 14px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1;">
          <span class="mono" style="font-size: 10px; letter-spacing: 0.1em; color: #6E7780;">C1 · 정차 사유 분포</span>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; flex-grow: 1; justify-content: center;">
            <svg width="140" height="140" viewBox="0 0 140 140">
              <defs>
                <pattern id="lockhatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
                  <line x1="0" y1="0" x2="0" y2="7" stroke="#BEBBB0" stroke-width="2.2"/>
                </pattern>
              </defs>
              <circle cx="70" cy="70" r="56" fill="none" stroke="url(#lockhatch)" stroke-width="22"/>
              <g transform="translate(58,56)">
                <rect x="0" y="10" width="24" height="18" rx="3" fill="none" stroke="#1F282E" stroke-width="2.4"/>
                <path d="M4 10 V7 a8 8 0 0 1 16 0 V10" fill="none" stroke="#1F282E" stroke-width="2.4"/>
              </g>
            </svg>
            <div style="text-align: center; display: flex; flex-direction: column; gap: 4px;">
              <span style="font-size: 13px; font-weight: 700;">GATE 2 통과 후 공개</span>
              <span style="font-size: 11.5px; color: #6E7780; line-height: 1.55;">VLM 태그는 사람 라벨 60건과<br>정밀도 0.7 검증을 통과해야 표시됩니다</span>
            </div>
          </div>
          <div class="mono" style="font-size: 10px; color: #6E7780; letter-spacing: 0.05em; text-align: center;">HYBRID · rules h1 · 검증 진행 중</div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
