<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; color: #141517; }
    .num { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; letter-spacing: -0.03em; }
    .mono { font-family: "IBM Plex Mono", Consolas, monospace; }
    a { color: #FF4F18; } a:hover { color: #141517; }
  </style>
</helmet>
<div style="width: 1280px; height: 800px; background: #F2F4F7; display: flex; overflow: hidden;">

  <div style="width: 72px; background: #141517; display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 26px;">
    <div style="width: 30px; height: 30px; background: #FF4F18; display: grid; place-items: center;">
      <svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1 L15 14 H1 Z" fill="none" stroke="#141517" stroke-width="1.8"/></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 8px; align-items: center;">
      <svg width="18" height="18" viewBox="0 0 18 18"><rect x="2" y="2" width="6" height="6" fill="#FF4F18"/><rect x="10" y="2" width="6" height="6" fill="#5b6068"/><rect x="2" y="10" width="6" height="6" fill="#5b6068"/><rect x="10" y="10" width="6" height="6" fill="#5b6068"/></svg>
      <svg width="18" height="18" viewBox="0 0 18 18"><path d="M2 14 L7 8 L11 11 L16 3" fill="none" stroke="#5b6068" stroke-width="2"/></svg>
      <svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 15 V9 M9 15 V3 M15 15 V6" stroke="#5b6068" stroke-width="2.4"/></svg>
      <svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="6.5" fill="none" stroke="#5b6068" stroke-width="1.8"/><path d="M9 5 V9 L12 11" fill="none" stroke="#5b6068" stroke-width="1.8"/></svg>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 26px 32px; gap: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: flex-end;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span class="mono" style="font-size: 11px; letter-spacing: 0.12em; color: #8a8f98;">PUBLIC · /DWELL</span>
        <span class="num" style="font-size: 30px; font-weight: 600;">정차 <span style="color: #FF4F18;">.</span></span>
      </div>
      <div class="mono" style="font-size: 11px; border-radius: 999px; padding: 6px 14px; background: #141517; color: #ffffff;">오늘 · 08:00–08:40</div>
    </div>

    <div style="display: flex; gap: 16px; flex-grow: 1;">
      <div style="flex: 2.1; background: #ffffff; border-radius: 14px; padding: 24px 26px; display: flex; flex-direction: column; gap: 14px;">
        <span style="font-size: 14px; font-weight: 700;">도로 평면 정차 히트맵 <span class="mono" style="font-weight: 400; font-size: 10.5px; color: #8a8f98;">M3 · 군집 3</span></span>
        <svg viewBox="0 0 720 400" style="width: 100%; flex-grow: 1;">
          <defs>
            <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
              <rect width="8" height="8" fill="#FF4F18" opacity="0.12"/>
              <line x1="0" y1="0" x2="0" y2="8" stroke="#FF4F18" stroke-width="2.4" opacity="0.6"/>
            </pattern>
          </defs>
          <rect x="20" y="120" width="680" height="160" fill="#F2F4F7"/>
          <line x1="20" y1="200" x2="700" y2="200" stroke="#c8ccd2" stroke-width="2" stroke-dasharray="16 12"/>
          <rect x="300" y="120" width="70" height="160" fill="#ffffff" stroke="#c8ccd2" stroke-width="1.5"/>
          <path d="M308 128 h54 M308 148 h54 M308 168 h54 M308 188 h54 M308 208 h54 M308 228 h54 M308 248 h54 M308 268 h54" stroke="#d4d8de" stroke-width="6"/>
          <text x="300" y="108" font-family="IBM Plex Mono, monospace" font-size="11" fill="#8a8f98">횡단보도</text>
          <rect x="20" y="280" width="240" height="26" fill="url(#hatch)"/>
          <text x="26" y="326" font-family="IBM Plex Mono, monospace" font-size="11" fill="#FF4F18">정차 금지 구역</text>
          <rect x="470" y="280" width="230" height="26" fill="#E9EBEF"/>
          <text x="476" y="326" font-family="IBM Plex Mono, monospace" font-size="11" fill="#8a8f98">드롭존</text>
          <circle cx="90"  cy="262" r="17" fill="#FF4F18" opacity="0.85"/>
          <circle cx="128" cy="252" r="11" fill="#FF4F18" opacity="0.6"/>
          <circle cx="176" cy="264" r="8"  fill="#FF4F18" opacity="0.45"/>
          <circle cx="415" cy="150" r="10" fill="#141517" opacity="0.6"/>
          <circle cx="445" cy="140" r="7"  fill="#141517" opacity="0.4"/>
          <circle cx="540" cy="258" r="12" fill="#141517" opacity="0.35"/>
          <circle cx="585" cy="266" r="8"  fill="#141517" opacity="0.25"/>
          <text x="66" y="222" font-family="Archivo, sans-serif" font-size="14" font-weight="600" fill="#FF4F18">C1 군집 · 4건</text>
          <text x="60" y="60" font-family="Noto Sans KR, sans-serif" font-size="12" fill="#8a8f98">교문</text>
          <path d="M40 40 L80 40 L80 76 L40 76 Z" fill="none" stroke="#8a8f98" stroke-width="1.5"/>
        </svg>
      </div>

      <div style="flex: 1; display: flex; flex-direction: column; gap: 16px;">
        <div style="background: #141517; color: #ffffff; border-radius: 14px; padding: 20px 22px; display: flex; flex-direction: column; gap: 4px;">
          <span class="mono" style="font-size: 10px; letter-spacing: 0.1em; color: #9aa0a8;">K2 · 구역 밖 20초+ 정차</span>
          <div style="display: flex; align-items: baseline; gap: 8px;">
            <span class="num" style="font-size: 52px; font-weight: 600;">6<span style="font-size: 22px; color: #9aa0a8;">건</span></span>
            <span class="num" style="font-size: 15px; color: #FF4F18; margin-left: auto;">/ ▼ 1</span>
          </div>
          <span class="mono" style="font-size: 10.5px; color: #9aa0a8;">최장 정차 94 s · 08:21</span>
        </div>

        <div style="background: #ffffff; border-radius: 14px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1;">
          <span class="mono" style="font-size: 10px; letter-spacing: 0.1em; color: #8a8f98;">C1 · 정차 사유 분포</span>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; flex-grow: 1; justify-content: center;">
            <svg width="140" height="140" viewBox="0 0 140 140">
              <defs>
                <pattern id="lockhatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
                  <line x1="0" y1="0" x2="0" y2="7" stroke="#c8ccd2" stroke-width="2.2"/>
                </pattern>
              </defs>
              <circle cx="70" cy="70" r="56" fill="none" stroke="url(#lockhatch)" stroke-width="22"/>
              <g transform="translate(58,56)">
                <rect x="0" y="10" width="24" height="18" rx="3" fill="none" stroke="#141517" stroke-width="2.4"/>
                <path d="M4 10 V7 a8 8 0 0 1 16 0 V10" fill="none" stroke="#141517" stroke-width="2.4"/>
              </g>
            </svg>
            <div style="text-align: center; display: flex; flex-direction: column; gap: 4px;">
              <span style="font-size: 13px; font-weight: 700;">GATE 2 통과 후 공개</span>
              <span style="font-size: 11.5px; color: #8a8f98; line-height: 1.55;">VLM 태그는 사람 라벨 60건과<br>정밀도 0.7 검증을 통과해야 표시됩니다</span>
            </div>
          </div>
          <div class="mono" style="font-size: 10px; color: #b0b5bc; letter-spacing: 0.05em; text-align: center;">HYBRID · rules h1 · 검증 진행 중</div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
