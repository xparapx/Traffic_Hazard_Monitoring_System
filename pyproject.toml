[project]
name = "trafficsvc"
version = "0.1.0"
description = "엣지 AI 통학 시간대 교통 위험 모니터링 — 엣지 서비스 (프레임 무저장)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# 기기(orin/pi) 전용 — install.sh 가 --extra camera 로 설치. 개발 PC·CI 는 불필요(fake 경로).
camera = ["opencv-python-headless>=4.8", "onnxruntime>=1.18"]

[project.scripts]
trafficsvc = "trafficsvc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "numpy>=1.26",   # detect postprocess(NMS·letterbox 역변환) 단위 테스트용
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edge/trafficsvc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
