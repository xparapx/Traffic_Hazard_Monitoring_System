# CI — 검증 루프의 독립 확인 경로 (전역 CLAUDE.md 검증 루프 규칙과 연계)
# 로컬 검증(pytest·lint·build·doctor)과 같은 검사를 제3의 머신이 push마다 재실행한다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# 연속 push 시 release 잡이 동시에 돌면 latest 삭제/생성이 겹쳐 draft 로 끼는
# 경합(2026-10-12 실측 — orin 404 로 수거 불가). ref 단위로 직렬화하고, 이전 실행은
# 취소해 마지막 커밋만 릴리스되게 한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 의존성 설치
        run: uv sync
      - name: pytest
        run: uv run pytest -q
      - name: doctor (스키마·이미지 0건 자가 점검)
        run: uv run trafficsvc doctor

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 의존성 설치
        run: npm ci --prefix web
      - name: eslint
        run: npm run lint --prefix web
      - name: build
        run: npm run build --prefix web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  # CD 발행 — 두 검증 잡을 모두 통과한 커밋만 'latest' 릴리스로 (orin 이 pull 형으로 수거)
  release:
    if: github.ref == 'refs/heads/main'
    needs: [python, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: dist 압축
        run: tar -czf web-dist.tar.gz -C web dist
      - name: latest 릴리스 갱신
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest web-dist.tar.gz \
            --title "latest (CI 통과 자동 발행)" \
            --notes "sha=${{ github.sha }}"
